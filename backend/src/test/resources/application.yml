spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/interview_assistant_test}
    driver-class-name: org.postgresql.Driver
    username: ${TEST_DATABASE_USER:postgres}
    password: ${TEST_DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  sql:
    init:
      mode: never

app:
  identity:
    expose-development-link: true
  invitation:
    expose-development-link: true
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    secret: V7l3Z4qB6uS8yC2dE9gH1jK5mN7pQ3rT6vW8xY0zA2bC4dE6fG8hI0jK2lM4nO6p
    access-expiration: 15m
  refresh-token:
    expiration: 7d
  security:
    rate-limit:
      window: 60s
      login: 1000
      register: 1000
      refresh: 1000

