spring:
  datasource:
    url: jdbc:h2:mem:interview_assistant;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  identity:
    expose-development-link: true
  invitation:
    expose-development-link: true
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    secret: V7l3Z4qB6uS8yC2dE9gH1jK5mN7pQ3rT6vW8xY0zA2bC4dE6fG8hI0jK2lM4nO6p
    access-expiration: 15m
  refresh-token:
    expiration: 7d
  security:
    rate-limit:
      window: 60s
      login: 1000
      register: 1000
      refresh: 1000

