spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true

server:
  tomcat:
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:5s}
    keep-alive-timeout: ${SERVER_KEEP_ALIVE_TIMEOUT:20s}
    max-connections: ${SERVER_MAX_CONNECTIONS:200}
    threads:
      max: ${SERVER_MAX_THREADS:100}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:7d}
    cleanup-retention: ${JWT_REFRESH_CLEANUP_RETENTION:P30D}
    cleanup-interval: ${JWT_REFRESH_CLEANUP_INTERVAL:PT6H}
    cleanup-initial-delay: ${JWT_REFRESH_CLEANUP_INITIAL_DELAY:PT5M}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
