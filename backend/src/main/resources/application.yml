spring:
  application:
    name: technical-interview-assistant
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interview_assistant}
    username: ${DATABASE_USER:interview_app}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:${SERVER_PORT:8081}}
  shutdown: graceful

app:
  deployment:
    mode: ${DEPLOYMENT_MODE:SAAS}
    public-signup-enabled: ${PUBLIC_SIGNUP_ENABLED:}
    multi-tenant-enabled: ${MULTI_TENANT_ENABLED:}
    billing-enabled: ${BILLING_ENABLED:}
  identity:
    expose-development-link: ${IDENTITY_EXPOSE_DEVELOPMENT_LINK:false}
  enterprise-identity:
    enabled: false
    provider-approved: false
    recovery-policy-approved: false
    verified-domains: []
  invitation:
    expose-development-link: ${INVITATION_EXPOSE_DEVELOPMENT_LINK:false}
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:7d}
    cleanup-retention: ${JWT_REFRESH_CLEANUP_RETENTION:P30D}
    cleanup-interval: ${JWT_REFRESH_CLEANUP_INTERVAL:PT6H}
    cleanup-initial-delay: ${JWT_REFRESH_CLEANUP_INITIAL_DELAY:PT5M}
  security:
    rate-limit:
      window: ${AUTH_RATE_LIMIT_WINDOW:60s}
      login: ${AUTH_LOGIN_RATE_LIMIT:10}
      register: ${AUTH_REGISTER_RATE_LIMIT:5}
      refresh: ${AUTH_REFRESH_RATE_LIMIT:30}
  llm:
    ollama:
      base-url: ${OLLAMA_BASE_URL:}
      model: ${OLLAMA_MODEL:}
      connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:3s}
      response-timeout: ${OLLAMA_RESPONSE_TIMEOUT:60s}
      max-input-chars: ${OLLAMA_MAX_INPUT_CHARS:120000}
      max-response-chars: ${OLLAMA_MAX_RESPONSE_CHARS:100000}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:dev}
    git-sha: ${GIT_SHA:local}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p appVersion=${APP_VERSION:dev} gitSha=${GIT_SHA:local} correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n"

