spring:
  application:
    name: technical-interview-assistant
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interview_assistant}
    username: ${DATABASE_USER:interview_app}
    password: ${DATABASE_PASSWORD:interview_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:dev}

