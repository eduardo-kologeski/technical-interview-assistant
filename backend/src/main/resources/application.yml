spring:
  application:
    name: technical-interview-assistant
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interview_assistant}
    username: ${DATABASE_USER:interview_app}
    password: ${DATABASE_PASSWORD:interview_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:V7l3Z4qB6uS8yC2dE9gH1jK5mN7pQ3rT6vW8xY0zA2bC4dE6fG8hI0jK2lM4nO6p}
    access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:7d}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:dev}

