name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test -- --watch=false
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run e2e:install
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate monitoring assets
        run: |
          jq empty monitoring/grafana/technical-interview-overview.json
          docker run --rm --entrypoint /bin/promtool \
            --volume "$PWD/monitoring:/monitoring:ro" \
            quay.io/prometheus/prometheus@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038 \
            check rules /monitoring/prometheus/technical-interview-rules.yml
      - name: Validate Compose configuration
        env:
          DATABASE_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-secret-with-at-least-sixty-four-characters-1234567890
        run: docker compose config --quiet
      - name: Build backend image
        run: >-
          docker build
          --build-arg APP_VERSION=0.0.0-ci
          --build-arg GIT_SHA=${{ github.sha }}
          --tag technical-interview-backend:${{ github.sha }}
          ./backend
      - name: Build frontend image
        run: docker build --tag technical-interview-frontend:${{ github.sha }} ./frontend
      - name: Scan backend image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: technical-interview-backend:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          output-format: table
      - name: Scan frontend image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: technical-interview-frontend:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          output-format: table
      - name: Smoke full container stack
        env:
          APP_IMAGE_TAG: ${{ github.sha }}
          DATABASE_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-secret-with-at-least-sixty-four-characters-1234567890
        run: |
          docker compose up --detach --wait --no-build
          curl --fail --silent --show-error http://127.0.0.1:8081/actuator/health
          curl --fail --silent --show-error http://127.0.0.1:4200/ > /dev/null
      - name: Collect container logs on failure
        if: failure()
        env:
          APP_IMAGE_TAG: ${{ github.sha }}
          DATABASE_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-secret-with-at-least-sixty-four-characters-1234567890
        run: docker compose logs --no-color --tail=200
      - name: Remove smoke stack
        if: always()
        env:
          APP_IMAGE_TAG: ${{ github.sha }}
          DATABASE_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-secret-with-at-least-sixty-four-characters-1234567890
        run: docker compose down --volumes --remove-orphans
