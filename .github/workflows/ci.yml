name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - name: Assert PostgreSQL and Flyway tests executed
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path('target/surefire-reports/TEST-com.kologeski.interviewassistant.migration.PostgresqlFlywayMigrationTest.xml')
          if not report.exists():
              raise SystemExit('PostgreSQL/Flyway test report is missing')
          suite = ElementTree.parse(report).getroot()
          if int(suite.attrib.get('skipped', '-1')) != 0 or int(suite.attrib.get('failures', '-1')) != 0 or int(suite.attrib.get('errors', '-1')) != 0:
              raise SystemExit(f'PostgreSQL/Flyway test did not execute successfully: {suite.attrib}')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test -- --watch=false
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run e2e:install
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate backup and restore scripts
        shell: pwsh
        run: |
          bash -n scripts/backup-postgres.sh
          bash -n scripts/restore-postgres.sh
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/backup-postgres.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/restore-postgres.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          bash scripts/tests/restore-guard.sh
          ./scripts/tests/restore-guard.ps1
      - name: Validate monitoring assets
        run: |
          jq empty monitoring/grafana/technical-interview-overview.json
          docker run --rm --entrypoint /bin/promtool \
            --volume "$PWD/monitoring:/monitoring:ro" \
            quay.io/prometheus/prometheus@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038 \
            check rules /monitoring/prometheus/technical-interview-rules.yml
      - name: Validate Compose configuration
        env:
          DATABASE_PASSWORD: ci-only-database-password
          JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LW1hdGVyaWFsLXdpdGgtYXQtbGVhc3Qtc2l4dHktZm91ci1ieXRlcy0yMDI2LTA4LTI4
        run: docker compose config --quiet
      - name: Validate On-Premises deployment package
        env:
          REGISTRY: ghcr.io/example
          APP_VERSION: 0.0.0-ci
          PUBLIC_ORIGIN: https://interviews.example.test
          DATABASE_URL: jdbc:postgresql://database.example.test:5432/interview_assistant
          DATABASE_USER: ci_user
          DATABASE_PASSWORD: ci-only-database-password
          JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LW1hdGVyaWFsLXdpdGgtYXQtbGVhc3Qtc2l4dHktZm91ci1ieXRlcy0yMDI2LTA4LTI4
        run: |
          docker compose --file deployment/docker-compose.yml config --quiet
          test "$(docker compose --file deployment/docker-compose.yml config --images | sort -u | wc -l)" -eq 2
          ! grep -Eq '^[[:space:]]*build:' deployment/docker-compose.yml
      - name: Build backend image
        run: >-
          docker build
          --build-arg APP_VERSION=0.0.0-ci
          --build-arg GIT_SHA=${{ github.sha }}
          --tag technical-interview-backend:${{ github.sha }}
          ./backend
      - name: Build frontend image
        run: docker build --tag technical-interview-frontend:${{ github.sha }} ./frontend
      - name: Scan backend image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: technical-interview-backend:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          output-format: table
      - name: Scan frontend image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: technical-interview-frontend:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          output-format: table
      - name: Smoke full container stack
        env:
          APP_IMAGE_TAG: ${{ github.sha }}
          DATABASE_PASSWORD: ci-only-database-password
          JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LW1hdGVyaWFsLXdpdGgtYXQtbGVhc3Qtc2l4dHktZm91ci1ieXRlcy0yMDI2LTA4LTI4
        run: |
          docker compose up --detach --wait --no-build
          curl --fail --silent --show-error http://127.0.0.1:8081/actuator/health
          curl --fail --silent --show-error http://127.0.0.1:4200/ > /dev/null
      - name: Collect container logs on failure
        if: failure()
        env:
          APP_IMAGE_TAG: ${{ github.sha }}
          DATABASE_PASSWORD: ci-only-database-password
          JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LW1hdGVyaWFsLXdpdGgtYXQtbGVhc3Qtc2l4dHktZm91ci1ieXRlcy0yMDI2LTA4LTI4
        run: docker compose logs --no-color --tail=200
      - name: Remove smoke stack
        if: always()
        env:
          APP_IMAGE_TAG: ${{ github.sha }}
          DATABASE_PASSWORD: ci-only-database-password
          JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LW1hdGVyaWFsLXdpdGgtYXQtbGVhc3Qtc2l4dHktZm91ci1ieXRlcy0yMDI2LTA4LTI4
        run: docker compose down --volumes --remove-orphans
