name: Dependency security

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

jobs:
  scan-current-tree:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.5.1
    with:
      # Private repositories without GitHub Code Scanning cannot accept SARIF uploads.
      # Keep fail-on-vuln enabled; only disable the unavailable reporting destination.
      upload-sarif: false
      scan-args: |-
        --include-git-root
        -r
        ./

  scan-pull-request:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5 # v2.5.1
    with:
      # The reporter still fails on newly introduced vulnerabilities.
      upload-sarif: false
      scan-args: |-
        --include-git-root
        -r
        ./
