services:
  backend:
    image: ${REGISTRY}/technical-interview-assistant-backend:${APP_VERSION:?Defina APP_VERSION com uma versão SemVer publicada}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DEPLOYMENT_MODE: ON_PREMISE
      DATABASE_URL: ${DATABASE_URL:?Defina a URL JDBC do PostgreSQL externo}
      DATABASE_USER: ${DATABASE_USER:?Defina DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Defina PUBLIC_ORIGIN}
      APP_VERSION: ${APP_VERSION}
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  frontend:
    image: ${REGISTRY}/technical-interview-assistant-frontend:${APP_VERSION:?Defina APP_VERSION com uma versão SemVer publicada}
    restart: unless-stopped
    ports:
      - "${LISTEN_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "busybox", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
