services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: interview_assistant
      POSTGRES_USER: interview_app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no ambiente ou arquivo .env local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_app -d interview_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    image: technical-interview-backend:${APP_IMAGE_TAG:-local}
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-SAAS}
      DATABASE_URL: jdbc:postgresql://postgres:5432/interview_assistant
      DATABASE_USER: interview_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no ambiente ou arquivo .env local}
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no ambiente ou arquivo .env local}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8081/actuator/health",
        ]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  frontend:
    image: technical-interview-frontend:${APP_IMAGE_TAG:-local}
    build: ./frontend
    ports:
      - "4200:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "busybox",
          "wget",
          "--spider",
          "--quiet",
          "http://127.0.0.1:8080/",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  postgres_data:
